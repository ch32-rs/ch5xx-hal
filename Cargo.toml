[package]
name = "ch5xx-hal"
version = "0.1.0"
edition = "2021"
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/ch32-rs/ch5xx-hal"
documentation = "https://docs.rs/ch5xx-hal"
categories = ["embedded", "no-std", "hardware-support"]
description = "HAL for the WCH CH5xx (BLE) RISC-V microcontrollers"
keywords = ["ch5xx", "risc-v", "hal"]
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
# Generated PAC, published as its own repository until a crates.io release.
ch5xx-metapac = { git = "https://github.com/ch32-rs/ch5xx-metapac", rev = "8750739", features = ["rt"] }

# `unsafe-trust-wch-atomics`: qingke refuses to build whenever the target claims
# byte atomics unless this is set. The CH5xx target JSON declares atomics (the
# V3C core is RV32IMBC, with A), so the guard applies. NOTE: the atomics have not
# been litmus-tested on CH585 — see the qingke guard's own warning.
qingke = { version = "0.8.4", features = ["critical-section-impl", "unsafe-trust-wch-atomics"] }
qingke-rt = { version = "0.8.4", optional = true }

embedded-hal = "1.0"
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-io = "0.7.1"

# Async I/O traits share the blocking traits' error type.
embedded-io-async = { version = "0.7.0", optional = true }

embassy-hal-internal = "0.5.0"

# Embassy time driver support. Optional so a bare-metal user does not pull in
# the executor/time stack.
embassy-sync = { version = "0.8.0", optional = true }
embassy-time-driver = { version = "0.2.2", optional = true }
embassy-time-queue-utils = { version = "0.3.2", optional = true }
embassy-usb-driver = { version = "0.2.2", optional = true }

# The QingKe V3C core has no A extension: `amoadd.w` and friends raise a
# hardware exception on the CH585. portable-atomic supplies CAS from a critical
# section instead, and its atomics must be used instead of `core::sync::atomic`
# anywhere a read-modify-write is involved.
portable-atomic = { version = "1.11", features = ["critical-section"] }

critical-section = "1.2.0"

[build-dependencies.proc-macro2]
version = "1.0"

[build-dependencies.quote]
version = "1.0"

[build-dependencies]
ch5xx-metapac = { git = "https://github.com/ch32-rs/ch5xx-metapac", rev = "8750739", default-features = false, features = [
    "metadata",
] }

[features]
default = ["rt"]
rt = ["dep:qingke-rt"]

# Chip-selection features. Exactly one must be enabled; `ch5xx-metapac` panics
# otherwise. Each also selects the QingKe core, because Cargo cannot select a
# dependency feature from `rt` based on another feature: V3A on CH572/CH573,
# V3C on CH581/CH584/CH585/CH592/CH595 and V4A on CH582/CH583.
#
# `qingke-rt?/<core>` only applies when `rt` has pulled the optional runtime
# in. CH582 and CH583 are on hardware; the others select a PAC and exist so a
# shared driver can be compiled against their register block. CH564 and CH569
# are absent because their GPIO blocks are not the 16-bit port registers this
# driver programs.
ch572 = ["ch5xx-metapac/ch572", "qingke/v3a", "qingke-rt?/v3a"]
ch573 = ["ch5xx-metapac/ch573", "qingke/v3a", "qingke-rt?/v3a"]
ch581 = ["ch5xx-metapac/ch581", "qingke/v3c", "qingke-rt?/v3c"]
ch582 = ["ch5xx-metapac/ch582", "qingke/v4a", "qingke-rt?/v4a", "qingke-rt?/highcode"]
ch583 = ["ch5xx-metapac/ch583", "qingke/v4a", "qingke-rt?/v4a", "qingke-rt?/highcode"]
ch584 = ["ch5xx-metapac/ch584", "qingke/v3c", "qingke-rt?/v3c"]
ch585 = ["ch5xx-metapac/ch585", "qingke/v3c", "qingke-rt?/v3c"]
ch592 = ["ch5xx-metapac/ch592", "qingke/v3c", "qingke-rt?/v3c"]
ch595 = ["ch5xx-metapac/ch595", "qingke/v3c", "qingke-rt?/v3c"]

## Embassy support. This only pulls the deps in; pick a driver with one of the
## `time-driver-*` features below.
embassy = [
    "dep:embassy-sync",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:embassy-usb-driver",
    "dep:embedded-hal-async",
    "dep:embedded-io-async",
    "rt",
]

## Time driver on the core SysTick counter. Lowest latency, but it takes SysTick
## away from the blocking `delay` driver — both cannot own it.
time-driver-systick = ["embassy"]

## Time driver on TMR0. Leaves SysTick to `delay` and everything else.
time-driver-tmr0 = ["embassy"]
## Time driver on TMR1 (this instance also has DMA).
time-driver-tmr1 = ["embassy"]
## Time driver on TMR2 (this instance also has DMA).
time-driver-tmr2 = ["embassy"]
## Time driver on TMR3.
time-driver-tmr3 = ["embassy"]

## Emit `memory.x` from the metapac's memory layout, so `qingke-rt`'s `link.x`
## can find it. Enable in the binary crate, not the HAL (see ch32-hal).
memory-x = ["ch5xx-metapac/memory-x"]

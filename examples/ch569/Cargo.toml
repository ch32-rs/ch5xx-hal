[package]
name = "ch569-examples"
version = "0.1.0"
edition = "2021"

[features]
default = ["time-driver-systick"]
time-driver-systick = ["ch5xx-hal/time-driver-systick"]

[dependencies]
# No `memory-x`: this crate ships its own `memory.x` because the CH569's
# RAMX/ROM split is a per-part option, not the 96K the PAC declares.
ch5xx-hal = { path = "../../", features = ["ch569", "rt"] }

panic-halt = "1.0"
qingke = "0.8.4"
qingke-rt = "0.8.4"
defmt = "1.0"
defmt-rtt = "1.3"

# `platform-spin`, not the default RISC-V platform: the executor's idle path
# calls `wfi` inside a critical section, and this core's `wfi` never returns
# with `mstatus.MIE = 0`. The executor's `portable-atomic` feature is not in
# the 0.10.0 release.
embassy-executor = { version = "0.10.0", features = ["platform-spin", "executor-thread", "portable-atomic"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-time-driver = "0.2"
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-8"] }
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
debug = 2       # defmt resolves log frames to file:line via DWARF.
lto = true
opt-level = "s"

[profile.dev]
overflow-checks = false

[patch.crates-io]
# One revision for the whole embassy graph, as in the other CH5xx examples: a
# mixed graph builds two `embassy-time-driver`s and two `TimerQueueItem`s.
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }

# Pulls in `embassy-time`, which needs a time-driver implementation.
[[bin]]
name = "embassy_time"
required-features = ["time-driver-systick"]

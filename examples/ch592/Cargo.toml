[package]
name = "ch592-examples"
version = "0.1.0"
edition = "2021"

[features]
default = ["time-driver-systick"]
time-driver-systick = ["ch5xx-hal/time-driver-systick"]
time-driver-tmr0 = ["ch5xx-hal/time-driver-tmr0"]
time-driver-tmr1 = ["ch5xx-hal/time-driver-tmr1"]
time-driver-tmr2 = ["ch5xx-hal/time-driver-tmr2"]
time-driver-tmr3 = ["ch5xx-hal/time-driver-tmr3"]

[dependencies]
ch5xx-hal = { path = "../../", features = ["ch592", "rt", "memory-x"] }

panic-halt = "1.0"
qingke = "0.8.4"
qingke-rt = "0.8.4"
defmt = "1.0"
defmt-rtt = "1.3"

embassy-executor = { version = "0.10.0", features = ["platform-riscv32", "executor-thread", "portable-atomic"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "0.6.0", default-features = false }

# CH592's QingKe V3C reports `misa = 0x40901105`: the A extension is claimed
# but was not exercised by the HAL, so `portable-atomic` still supplies the
# atomics from a critical section. Do not switch to `riscv32imac`: the
# compiler would emit `amoadd.w` the core may not execute.
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false
debug = 2
lto = true
opt-level = "s"

[profile.dev]
overflow-checks = false

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }

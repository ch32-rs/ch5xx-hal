[package]
name = "ch585-examples"
version = "0.1.0"
edition = "2021"

[features]
# Which peripheral the embassy time driver takes. Under `time-driver-systick`
# the HAL's `Delay` reads that driver's timebase instead of polling the raw
# counter, so the `delay`-based examples keep working.
default = ["time-driver-systick"]
time-driver-systick = ["ch5xx-hal/time-driver-systick"]
time-driver-tmr0 = ["ch5xx-hal/time-driver-tmr0"]
time-driver-tmr1 = ["ch5xx-hal/time-driver-tmr1"]
time-driver-tmr2 = ["ch5xx-hal/time-driver-tmr2"]
time-driver-tmr3 = ["ch5xx-hal/time-driver-tmr3"]

[dependencies]
ch5xx-hal = { path = "../../", features = ["ch585", "rt", "memory-x"] }

panic-halt = "1.0"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.1"

qingke = "0.8.4"
qingke-rt = "0.8.4"
defmt = "1.0"
defmt-rtt = "1.3"

# The CH585's QingKe V3C core is RV32IMBC — there is **no A extension**, and
# executing `amoadd.w`/`amoswap.w`/`lr.w` raises a hardware exception. Using the
# standard `riscv32imac` target would make the compiler emit those instructions.
# `portable-atomic` supplies them from a critical section instead, and embassy
# picks its no-atomics executor state machine in response.
embassy-executor = { version = "0.10.0", features = ["platform-riscv32", "executor-thread", "portable-atomic"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "0.6.0", default-features = false }
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
debug = 2       # defmt resolves log frames to file:line via DWARF; without it every line prints `<invalid location>`.
lto = true
opt-level = "s"

[profile.dev]
overflow-checks = false

[patch.crates-io]
# embassy 0.10.0/0.6.0 were published on 2026-03-20. Post-release changes are
# still unpublished: the executor's `portable-atomic` feature (2026-09-22) is
# required because the QingKe V3C has no A extension, and `UsbDeviceSpeed` /
# `Config::max_speed` are required by the USBHS example. Pin the official
# repository until a release carries them.
#
# The graph must resolve to one revision. A registry `embassy-usb-driver` would
# be a different `Driver` trait, a second `embassy-executor-timer-queue` build
# would use a different `timer-item-size-*` feature and leave the executor's
# `TimerQueueItem` zero-sized, and two `embassy-time-driver` builds both claim
# the `embassy-time` native link.
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }

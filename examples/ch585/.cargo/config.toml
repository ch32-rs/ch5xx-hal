[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
# `probe-rs run` flashes, resets, and streams defmt over RTT in one step.
# Swap back to `wlink flash` if you only want to program the part.
# runner = "wlink flash"
runner = "probe-rs run --chip CH585"
rustflags = [
    # `+b` — the V3C implements the ratified Zba/Zbb/Zbs encodings (verified on
    # hardware), so letting LLVM emit them is safe and shrinks the image by
    # ~16 KiB. It is a standard, stable target feature: no warning.
    #
    # `+zbc` would add the third carry-less-multiply opcode, `clmulr`, which this
    # part also executes. It is left out because nothing in the compiler emits it
    # yet -- `u32::carryless_mul` is still unstable -- so it costs nothing to
    # wait rather than track an opcode no code path uses.
    #
    # `+xwchc` — WCH's extra compressed loads/stores (`c.lbu`, `c.shsp`, ...), the
    # `XW` row of the manual's table 1-1. Rust does not model this extension, so
    # the feature is unknown to the compiler: every build prints
    # "unknown and unstable feature ... `xwchc`" and rustc plans to turn that
    # into a hard error (rust-lang/rust#162235). It is passed anyway because the
    # backend does accept it; revisit when the deprecation lands.
    #
    # `+zcb` is not an alternative: LLVM rejects the pair outright, since WCH's
    # `XW` predates Zcb and both claim the compressed byte/halfword load-store
    # encodings ("rustc-LLVM ERROR: 'xwchc' and 'zcb' extensions are
    # incompatible"). Keeping `xwchc` is what the silicon's own toolchain uses.
    "-C",
    "target-feature=+b,+xwchc",
]

[unstable]
build-std = ["core"]

[env]
DEFMT_LOG = "info"

[package]
name = "ch582-examples"
version = "0.1.0"
edition = "2021"

[features]
# Keep the default bare-metal examples independent of Embassy.
default = []
# TMR3 leaves SysTick available to the existing clock and delay examples.
usb-cdc = ["dep:embassy-executor", "dep:embassy-time", "dep:embassy-usb", "time-driver-tmr3"]
spi-async = ["dep:embassy-executor", "dep:embassy-time", "time-driver-tmr3"]
time-driver-systick = ["ch5xx-hal/time-driver-systick"]
time-driver-tmr0 = ["ch5xx-hal/time-driver-tmr0"]
time-driver-tmr1 = ["ch5xx-hal/time-driver-tmr1"]
time-driver-tmr2 = ["ch5xx-hal/time-driver-tmr2"]
time-driver-tmr3 = ["ch5xx-hal/time-driver-tmr3"]

[[bin]]
name = "spi_async_loopback"
path = "src/bin/spi_async_loopback.rs"
required-features = ["spi-async"]

[[bin]]
name = "usb_cdc_echo"
path = "src/bin/usb_cdc_echo.rs"
required-features = ["usb-cdc"]

[[bin]]
name = "usb2_cdc_echo"
path = "src/bin/usb2_cdc_echo.rs"
required-features = ["usb-cdc"]

[dependencies]
ch5xx-hal = { path = "../../", features = ["ch582", "rt", "memory-x"] }

panic-halt = "1.0"
qingke = "0.8.4"
qingke-rt = "0.8.4"
defmt = "1.0"
defmt-rtt = "1.3"
embedded-hal = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-riscv32", "executor-thread", "portable-atomic"], optional = true }
embassy-usb = { version = "0.6.0", default-features = false, optional = true }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"], optional = true }

# QingKe V4A implements A, but the HAL's atomics go through
# `portable-atomic` / critical sections, matching the other CH5xx parts.
# The matching `riscv32imac` target makes the compiler emit `amo*` freely;
# this dependency choice only covers the HAL's own code.
portable-atomic = { version = "1.11", features = ["critical-section"] }

[profile.release]
strip = false
debug = 2
lto = true
opt-level = "s"

[profile.dev]
overflow-checks = false

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "4e2fa2e3ae7c9fd62a32193f47af12f68df3df7d" }
